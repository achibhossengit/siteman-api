services:
  db:
    image: postgres:17
    container_name: siteman-db
    # Local dev credentials only; must stay in sync with DATABASE_URL in .env
    environment:
      POSTGRES_DB: siteman
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - siteman_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: siteman-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - siteman_pgadmin:/var/lib/pgadmin
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: siteman-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - siteman_redisdata:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

volumes:
  siteman_pgdata:
  siteman_pgadmin:
  siteman_redisdata:
  redisinsight_data:
